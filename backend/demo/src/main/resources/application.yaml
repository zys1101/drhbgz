server:
  port: 9000                 # 后端服务端口
  servlet:
    context-path: /api       # 统一API前缀，前端通过 vue devServer 代理 /api 访问

springdoc:
  api-docs:
    path: /api-docs          # Swagger文档：http://localhost:9000/api/swagger-ui.html
  swagger-ui:
    path: /swagger-ui.html

# 数据库的链接配置（先执行 sql/nep_system.sql 建库）
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/nep_system?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: As.123456      # 请改成自己的MySQL密码

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发阶段可打开SQL日志
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
