  servlet:
    context-path: /api       # 统一API前缀，前端通过 vue devServer 代理 /api 访问

springdoc:
  api-docs:
    path: /api-docs          # Swagger文档：http://localhost:9000/api/swagger-ui.html
  swagger-ui:
    path: /swagger-ui.html

